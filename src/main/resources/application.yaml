# ---- Gotify ----
gotify:
  # Gotify 服务地址，http(s):// 与 ws(s):// 都支持
  base-url: ${GOTIFY_BASE_URL:http://localhost:8080}
  # 订阅 /stream 用的 Client token（必填，留空则启动时记录错误并跳过连接）
  # 注意：这里必须是 Client token（Gotify UI → Clients），Application token 会被服务端以 401 拒绝
  token: ${GOTIFY_CLIENT_TOKEN:}
  mail:
    # 邮件收件人，多个用逗号分隔
    to: ${GOTIFY_MAIL_TO:}
    # 严格大于该值才转发（即 7 及以上）
    priority-threshold: ${GOTIFY_MAIL_PRIORITY_THRESHOLD:6}
  reconnect:
    # 断线重连的指数退避参数
    initial-delay: 1s
    max-delay: 60s
    multiplier: 2
    # 最大重试次数（不含首次连接）
    max-retries: 3

# ---- SMTP ----
quarkus:
  mailer:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    start-tls: OPTIONAL
    from: ${SMTP_FROM:gotify-sidebar@localhost}

  # ---- WebSocket 客户端 ----
  websockets-next:
    client:
      # Gotify /stream 是长连接，依赖心跳探测半开连接
      auto-ping-interval: 30s
      # 超过该时长没有任何帧（含 pong）则判定连接已死
      connection-idle-timeout: 90s
      # 单条消息上限，防止超大 payload 撑爆内存
      max-message-size: 1048576

  # ---- 数据源（验证期用 H2，文件库便于外部工具查看） ----
  datasource:
    db-kind: h2
    jdbc:
      # 注意：Quarkus 3.39 已移除扁平的 jdbc-url，必须使用嵌套的 jdbc.url，否则该键会被静默忽略
      # 相对路径的基准是进程工作目录（非项目根），IDE / 容器 / systemd 下可能落到不同位置
      url: jdbc:h2:file:./data/gotify
    # 本地 H2 文件库的默认超管账号与空密码；仅限验证期，换真实库时必须改为环境变量注入
    username: sa
    password: ""

  hibernate-orm:
    schema-management:
      # 验证期由 Hibernate 自动建表；勿与已废弃的 database.generation 同时使用
      strategy: update
