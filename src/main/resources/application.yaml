# ---- Gotify ----
gotify:
  # Gotify 服务地址，http(s):// 与 ws(s):// 都支持
  base-url: ${GOTIFY_BASE_URL:http://localhost:8080}
  # Gotify 的 token（必填，留空则启动时记录错误并跳过连接）
  token: ${GOTIFY_TOKEN:}
  mail:
    # 邮件收件人，多个用逗号分隔
    to: ${GOTIFY_MAIL_TO:}
  reconnect:
    # 断线重连的指数退避参数
    initial-delay: 1s
    max-delay: 60s
    multiplier: 2

# ---- SMTP ----
quarkus:
  mailer:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    start-tls: OPTIONAL
    from: ${SMTP_FROM:gotify-sidebar@localhost}

# ---- 测试环境 ----
"%test":
  gotify:
    base-url: ws://localhost:8081
    token: test-token
    mail:
      to: test@example.com
  quarkus:
    mailer:
      mock: true
